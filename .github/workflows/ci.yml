name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the end-to-end tests against a local CMS v1.5 (about 20 minutes)
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec web-ext lint --source-dir .output/firefox-mv3

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Local CMS v1.5 (docs/dev-server.md)
        run: |
          git clone --depth 1 --branch v1.5 --recurse-submodules --shallow-submodules https://github.com/cms-dev/cms.git cms-server
          scripts/seed.sh
          nohup scripts/dev-server.sh > dev-server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8889/login > /dev/null && break; sleep 5; done
          # Let the seeded submissions finish evaluating.
          sleep 90
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            dev-server.log
